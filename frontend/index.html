<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentinels of Truth</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #fff;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .box {
            border: 1px solid #ccc;
            padding: 20px;
            margin: 20px 0;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #999;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background: #0066cc;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #0052a3;
        }
        button:disabled {
            background: #999;
        }
        .result {
            display: none;
            border: 1px solid #ccc;
            padding: 20px;
            margin-top: 20px;
        }
        .result.show {
            display: block;
        }
        .status {
            font-weight: bold;
            padding: 5px 10px;
            display: inline-block;
            margin: 5px 5px 5px 0;
        }
        .status.real { background: #d4edda; color: #155724; }
        .status.fake { background: #f8d7da; color: #721c24; }
        .status.uncertain { background: #fff3cd; color: #856404; }
        .status.insert { background: #cce5ff; color: #004085; }
        .status.flag { background: #f8d7da; color: #721c24; }
        .status.discard { background: #e2e3e5; color: #383d41; }
        .status.neutral { background: #e2e3e5; color: #333; }
        .row {
            margin: 10px 0;
        }
        .label {
            font-weight: bold;
            display: inline-block;
            width: 100px;
        }
        .reasoning-box {
            margin-top: 15px;
            padding: 12px;
            background: #f4f6f9;
            border-left: 4px solid #0066cc;
        }
        .sources-box {
            margin-top: 15px;
        }
        .sources-box ul {
            padding-left: 20px;
            font-size: 14px;
            margin: 5px 0 0 0;
        }
        .sources-box a {
            color: #0052a3;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Sentinels of Truth</h1>

    <div class="box">
        <textarea id="claimInput" placeholder="Enter a claim to verify..."></textarea>
        <br>
        <button id="verifyBtn" onclick="verifyClaim()">Verify Claim</button>
        <div id="loading" style="display:none; margin-top:10px;">Checking...</div>
    </div>

    <div class="result" id="result">
        <div id="badges"></div>

        <div class="row"><span class="label">Claim:</span> <span id="claimText"></span></div>

        <div class="reasoning-box">
            <span class="label">Analysis:</span>
            <p id="reasoningText" style="margin: 5px 0 0 0; line-height: 1.5; color: #444;"></p>
        </div>

        <div class="sources-box">
            <span class="label">Sources:</span>
            <ul id="sourcesList"></ul>
        </div>

        <div class="row"><span class="label">Action:</span> <span id="action"></span></div>
        <div class="error" id="error"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8001';

        async function verifyClaim() {
            const input = document.getElementById('claimInput');
            const btn = document.getElementById('verifyBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            const claim = input.value.trim();
            if (!claim) return;

            btn.disabled = true;
            loading.style.display = 'block';
            result.classList.remove('show');

            try {
                const controller = new AbortController();

const timeout = setTimeout(() => controller.abort(), 60000);
const response = await fetch(API_URL + '/verify', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({claim: claim}),
    signal: controller.signal
});
clearTimeout(timeout);
                const data = await response.json();
                showResult(data);
            } catch (err) {
    if (err.name === 'AbortError') {
        showResult({error: 'Request timed out after 60 seconds'});
    } else {
        showResult({error: 'Backend not running or unreachable'});
    }
}

        function showResult(data) {
            const result = document.getElementById('result');
            const badges = document.getElementById('badges');

            document.getElementById('claimText').textContent = data.claim || '';
            document.getElementById('action').textContent = data.action || 'N/A';
            document.getElementById('error').textContent = data.error || '';
            document.getElementById('reasoningText').textContent = data.reasoning || 'No analysis available.';


            const sourcesList = document.getElementById('sourcesList');
            sourcesList.innerHTML = '';
            if (data.sources && data.sources.length > 0) {
                data.sources.forEach(function(url) {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.textContent = url;
                    li.appendChild(a);
                    sourcesList.appendChild(li);
                });
            } else {
                sourcesList.innerHTML = '<li style="color: #777;">No sources found.</li>';
            }


            let html = '';
            if (data.verdict) {
                html += '<span class="status ' + data.verdict.toLowerCase() + '">' + data.verdict + '</span>';
            }
            if (data.action) {
                html += '<span class="status ' + data.action.toLowerCase() + '">' + data.action + '</span>';
            }
            if (typeof data.confidence === 'number') {
                html += '<span class="status neutral">' + (data.confidence * 100).toFixed(1) + '%</span>';
            }
            badges.innerHTML = html;

            result.classList.add('show');
        }}
    </script>
</body>
</html>
